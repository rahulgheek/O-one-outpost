name: Build Service JARs

on:
  push:
    branches: [main]
    paths:
      - "gateway-service/**"
      - "auth-service/**"
      - "arena-service/**"
      - "assessment-service/**"
      - "analytics-service/**"
      - "code-sandbox/**"
      - ".github/workflows/build-jars.yml"
  pull_request:
    paths:
      - "gateway-service/**"
      - "auth-service/**"
      - "arena-service/**"
      - "assessment-service/**"
      - "analytics-service/**"
      - "code-sandbox/**"
      - ".github/workflows/build-jars.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway-service
            artifact: gateway-service-jar
          - service: auth-service
            artifact: auth-service-jar
          - service: arena-service
            artifact: arena-service-jar
          - service: assessment-service
            artifact: assessment-service-jar
          - service: analytics-service
            artifact: analytics-service-jar
          - service: code-sandbox
            artifact: code-sandbox-jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: chmod +x ./mvnw && ./mvnw -B -DskipTests clean package

      - name: Stage app.jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          jar="$(find "${{ matrix.service }}/target" -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n1)"
          if [ -z "$jar" ]; then
            echo "No runnable JAR produced for ${{ matrix.service }}" >&2
            exit 1
          fi
          cp "$jar" dist/app.jar
          ls -lh dist/app.jar

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/app.jar
          if-no-files-found: error
          retention-days: 14

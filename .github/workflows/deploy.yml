name: Build & Deploy (legacy AWS EC2)

# Legacy single-host Docker/AWS flow. The production topology now uses Botkeep
# plus a sandbox VPS (see deploy/README.md). Kept for manual fallback only.
on:
  workflow_dispatch:

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: gateway-service, image: ooo-gateway-service }
          - { name: auth-service, image: ooo-auth-service }
          - { name: arena-service, image: ooo-arena-service }
          - { name: assessment-service, image: ooo-assessment-service }
          - { name: analytics-service, image: ooo-analytics-service }
          - { name: code-sandbox, image: ooo-code-sandbox }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.name }}
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ matrix.service.image }}:latest
            ${{ env.DOCKER_USER }}/${{ matrix.service.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/o-one-outpost
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

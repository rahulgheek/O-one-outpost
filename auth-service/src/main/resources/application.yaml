server:
  port: 8081

spring:
  main:
    lazy-initialization: true
  application:
    name: auth-service
  config:
    import: optional:file:./auth-service/.env[.properties], optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration (External Upstash Redis with TLS)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  # Email Configuration (Brevo SMTP Relay)
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

internal:
  secret: ${INTERNAL_SECRET:}

logging:
  level:
    com.aegis.auth_service: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
server:
  port: 8080
  # Botkeep/Caddy terminate TLS and forward requests. This makes the gateway honour
  # X-Forwarded-* headers so client IPs and redirects are correct.
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  main:
    lazy-initialization: true
  application:
    name: gateway-service
  config:
    import: optional:file:./gateway-service/.env[.properties], optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Upstash requires TLS. Set REDIS_SSL=false for a plain Redis instance.
      ssl:
        enabled: ${REDIS_SSL:true}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s

          routes:
            # ── Auth Service (public endpoints — no JWT filter) ──
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/auth/**

            # ── Daily Question (PUBLIC — time-lock enforced server-side) ──
            - id: daily-question-public
              uri: ${ARENA_SERVICE_URL}
              predicates:
                - Path=/api/problems/daily

            # ── Arena Service (protected) ──
            - id: arena-service
              uri: ${ARENA_SERVICE_URL}
              predicates:
                - Path=/api/match/**,/api/problems/**,/api/profiles/**,/api/arena/**
              filters:
                - IpBlockingFilter
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"

            # ── Arena WebSocket (browsers connect through the gateway) ──
            - id: arena-websocket
              uri: ${ARENA_WS_URL}
              predicates:
                - Path=/ws-arena/**

            # ── Analytics Service (protected) ──
            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL}
              predicates:
                - Path=/api/analytics/**
              filters:
                - IpBlockingFilter
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"

            # ── Assessment Service (protected) ──
            - id: assessment-service
              uri: ${ASSESSMENT_SERVICE_URL}
              predicates:
                - Path=/api/candidate/**,/api/assessment/**
              filters:
                - IpBlockingFilter
                - AuthenticationFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"

jwt:
  secret: ${JWT_SECRET}

internal:
  secret: ${INTERNAL_SECRET:}

# Comma-separated origins. The gateway is the only public entry point, so this is
# where the frontend origin(s) must be allow-listed.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:*}

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    com.aegis.gateway_service: ${LOG_LEVEL_GATEWAY:INFO}
    reactor.netty.http.server.HttpServerOperations: ERROR

# =============================================================================
# LEGACY SINGLE-HOST DEPLOYMENT (manual fallback only).
#
# This starts all six services on one Docker host and is intentionally NOT the
# production path. Production deploys each service independently to its own
# server, so no service shares a Docker network, Redis container, or host.
#
# Independent path:
#   - one JAR per service from deploy/artifacts/<service>/app.jar
#   - one env block per service from <service>/.env.example
#   - public HTTPS URLs between services (never http://<service-name>:<port>)
#   - code-sandbox alone on its Docker VPS (deploy/vps/code-sandbox)
# =============================================================================
services:
  gateway-service:
    image: rahulgheek/o-one-outpost-gateway:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    expose:
      - "8080"
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env.prod
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ARENA_SERVICE_URL=http://arena-service:8084
      - ARENA_WS_URL=ws://arena-service:8084
      - ANALYTICS_SERVICE_URL=http://analytics-service:8082
      - ASSESSMENT_SERVICE_URL=http://assessment-service:8083
    depends_on:
      auth-service:
        condition: service_healthy
      arena-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    image: rahulgheek/o-one-outpost-auth:${IMAGE_TAG:-latest}
    expose:
      - "8081"
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 448m
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  arena-service:
    image: rahulgheek/o-one-outpost-arena:${IMAGE_TAG:-latest}
    expose:
      - "8084"
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env.prod
    environment:
      - SANDBOX_URL=http://code-sandbox:8085/api/sandbox/execute
    depends_on:
      code-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  assessment-service:
    image: rahulgheek/o-one-outpost-assessment:${IMAGE_TAG:-latest}
    expose:
      - "8083"
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 448m
    env_file:
      - .env.prod
    environment:
      - SANDBOX_URL=http://code-sandbox:8085/api/sandbox/execute
    depends_on:
      code-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  analytics-service:
    image: rahulgheek/o-one-outpost-analytics:${IMAGE_TAG:-latest}
    expose:
      - "8082"
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - .env.prod
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ASSESSMENT_SERVICE_URL=http://assessment-service:8083
      - ARENA_SERVICE_URL=http://arena-service:8084
      - SANDBOX_URL=http://code-sandbox:8085
      - GATEWAY_URL=http://gateway-service:8080
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  code-sandbox:
    image: rahulgheek/o-one-outpost-sandbox:${IMAGE_TAG:-latest}
    expose:
      - "8085"
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - .env.prod
    environment:
      - JUDGE_EXECUTION_BACKEND=${JUDGE_EXECUTION_BACKEND:-docker}
      - JUDGE_DOCKER_HOST=${JUDGE_DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
